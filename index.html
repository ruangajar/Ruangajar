<!DOCTYPE html>
<html lang="id" data-theme="light" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ruang Ajar</title>
  <meta name="description" content="Ruang Ajar — manajemen kelas perkuliahan: materi, tugas, absensi QR, nilai, dan sesi kelas interaktif.">
  <meta name="theme-color" content="#7C6FE0">
  <meta name="author" content="Siska, Fasilkom">
  <meta name="copyright" content="© 2026 Siska, Fasilkom. Seluruh hak dilindungi.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Bootstrap 5 + Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Plus Jakarta Sans (sans-serif geometris, sesuai referensi visual) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Gaya aplikasi -->
  <link href="css/style.css?v=2.1.0" rel="stylesheet">
</head>
<body class="logged-out">

  <!-- Loading awal -->
  <div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite">
    <div class="brand-mark brand-mark-lg" aria-hidden="true"><i class="bi bi-mortarboard"></i></div>
    <div class="spinner-ring mt-4"></div>
    <p class="mt-3 text-secondary-ss">Memuat Ruang Ajar…</p>
  </div>

  <!-- Penjaga pemuatan: bila aplikasi gagal dimuat, tampilkan penyebabnya (bukan spinner tanpa akhir) -->
  <script>
    window.__boot = { step: 'memuat skrip aplikasi', errors: [], started: false };
    function showBootProblem(title, detail) {
      var o = document.getElementById('loadingOverlay');
      if (!o) return; // aplikasi sudah tampil → abaikan
      o.innerHTML = '<div style="max-width:560px;padding:24px;text-align:left">' +
        '<div class="brand-mark" style="background:#D93F44"><i class="bi bi-exclamation-lg"></i></div>' +
        '<h1 style="font-size:1.25rem;margin:16px 0 8px">' + title + '</h1>' +
        '<p style="color:#6E6E7A;margin-bottom:12px">Langkah terakhir: <b>' + window.__boot.step + '</b></p>' +
        (detail ? '<pre style="white-space:pre-wrap;background:#fff;border:1px solid #ECECF1;border-radius:12px;padding:12px;font-size:.82rem">' +
          String(detail).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) + '</pre>' : '') +
        '<p style="color:#6E6E7A;font-size:.88rem">Kirim tangkapan layar halaman ini ke admin aplikasi. Setelah diperbaiki, muat ulang halaman (F5).</p></div>';
    }
    window.addEventListener('error', function (e) {
      window.__boot.errors.push((e.message || 'Error') + (e.filename ? ' @ ' + e.filename.split('/').pop() : '') + (e.lineno ? ':' + e.lineno : ''));
      showBootProblem('Aplikasi gagal dimuat (error JavaScript)', window.__boot.errors.join('\n'));
    });
    setTimeout(function () {
      if (!document.getElementById('loadingOverlay')) return;
      showBootProblem(window.__boot.started ? 'Server tidak merespons' : 'Skrip aplikasi tidak berjalan',
        (window.__boot.started
          ? 'Server tidak menjawab dalam 25 detik.\nCek: (1) GAS_URL di js/config.js sudah benar (URL /exec), (2) deployment Apps Script: Execute as Me, akses Anyone, dan versi terbaru, (3) buka alamat GAS_URL + "?action=ping" di tab baru — harus tampil teks JSON, (4) setupAppEnvironment() sudah dijalankan.'
          : 'Kode JavaScript tidak sempat dijalankan. Pastikan folder js/ (config.js, api.js, app.js) ikut ter-upload ke GitHub, lalu muat ulang dengan Ctrl+Shift+R.') +
        (window.__boot.errors.length ? '\n\n' + window.__boot.errors.join('\n') : ''));
    }, 25000);
  </script>

  <!-- Sidebar ramping (laptop) — diisi renderNavigation() -->
  <nav id="sidebar" class="sidebar" aria-label="Navigasi utama">
    <button class="brand-mark" onclick="navigateTo('dashboard')" aria-label="Beranda Ruang Ajar">
      <i class="bi bi-mortarboard"></i>
    </button>
    <ul id="sidebar-nav" class="rail-nav"></ul>
    <div class="rail-bottom">
      <button class="rail-btn" onclick="toggleDarkMode()" data-label="Mode gelap" aria-label="Ganti mode terang/gelap">
        <i class="bi bi-moon-stars theme-icon"></i>
      </button>
      <button class="rail-btn" onclick="handleLogout()" data-label="Keluar" aria-label="Keluar">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </nav>

  <!-- Area utama -->
  <main id="mainContent" class="main-content">

    <!-- Top bar -->
    <header id="topbar" class="topbar">
      <div class="topbar-left">
        <button id="backBtn" class="icon-btn d-none" onclick="goBack()" aria-label="Kembali"><i class="bi bi-arrow-left"></i></button>
        <div class="brand-mark brand-mark-sm d-md-none" aria-hidden="true"><i class="bi bi-mortarboard"></i></div>
        <h1 id="pageTitle" class="page-title d-md-none">Beranda</h1>
        <label class="search-box d-none d-md-flex" for="globalSearch">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input id="globalSearch" type="search" placeholder="Cari kelas…" autocomplete="off"
                 onkeydown="if(event.key==='Enter'){navigateTo('kelas',{q:this.value})}">
        </label>
      </div>
      <div class="topbar-right">
        <div class="user-chip d-none d-md-flex">
          <div class="text-end">
            <div id="userName" class="user-name">-</div>
            <div id="userSub" class="user-sub">-</div>
          </div>
          <div id="userAvatar" class="avatar">S</div>
        </div>
        <button id="refreshBtn" class="icon-btn" onclick="forceRefresh()" aria-label="Muat data terbaru" title="Muat data terbaru"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="icon-btn d-md-none" onclick="toggleDarkMode()" aria-label="Ganti mode terang/gelap"><i class="bi bi-moon-stars theme-icon"></i></button>
        <div class="position-relative">
          <button id="notifBtn" class="icon-btn" onclick="toggleNotif()" aria-label="Notifikasi" aria-expanded="false">
            <i class="bi bi-bell"></i><span id="notifBadge" class="notif-dot d-none"></span>
          </button>
          <div id="notifPanel" class="notif-panel d-none" role="dialog" aria-label="Daftar notifikasi"></div>
        </div>
      </div>
    </header>

    <!-- KONTAINER UTAMA SPA: semua halaman disuntikkan di sini -->
    <div id="app-container" class="app-container" tabindex="-1"></div>

    <footer class="app-footer">Made with care to support a better learning experience. — Siska, Fasilkom<span class="copy">© 2026 Siska, Fasilkom. Seluruh hak dilindungi.</span></footer>
  </main>

  <!-- Bottom navigation (HP) — diisi renderNavigation() -->
  <nav id="bottomNav" class="bottom-nav" aria-label="Navigasi bawah"></nav>

  <!-- Modal umum -->
  <div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="appModalTitle">Judul</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body" id="appModalBody"></div>
        <div class="modal-footer" id="appModalFooter"></div>
      </div>
    </div>
  </div>

  <!-- Modal pratinjau file (Tutup + Unduh, tidak membuka tab baru) -->
  <div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h6 text-truncate" id="previewTitle">Pratinjau</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body p-0 preview-body" id="previewContent"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal"><i class="bi bi-x-lg"></i> Tutup</button>
          <a id="downloadBtn" href="javascript:void(0)" class="btn btn-ink"><i class="bi bi-download"></i> Unduh</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Layar QR proyektor (layar penuh) -->
  <div id="projector" class="projector d-none" role="dialog" aria-label="Layar QR absensi"></div>

  <!-- Wadah tersembunyi untuk membaca QR dari foto -->
  <div id="qrFileReader" style="position:absolute;left:-10000px;top:0;width:640px;height:480px;overflow:hidden" aria-hidden="true"></div>

  <!-- Toast -->
  <div id="toastStack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>

  <!-- Library CDN (Chart.js, SortableJS, QR & Excel dimuat saat dibutuhkan — lihat LIBS) -->
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Kode aplikasi: urutan penting (config → api → app). defer = tidak menghalangi tampilan awal. Versi ?v= harus sama dengan VERSION di sw.js -->
  <script defer src="js/config.js?v=2.1.0"></script>
  <script defer src="js/api.js?v=2.1.0"></script>
  <script defer src="js/app.js?v=2.1.0"></script>
  <noscript><p style="padding:24px;font-family:sans-serif">Ruang Ajar memerlukan JavaScript. Aktifkan JavaScript di peramban Anda.</p></noscript>
</body>
</html>
